# Invitación de boda, served at:
#   https://my-brand.com/live-projects/letters/invitacion-boda-isaias-y-nicole/
# from the folder:
#   /var/www/my-brand/live-projects/letters/invitacion-boda-isaias-y-nicole/
#
# Include this file INSIDE the server { } block of my-brand.com
# (see README → "Deploy on AWS Ubuntu with nginx").

# 1) Without the trailing slash, the page's relative links (css/…, js/…, assets/…)
#    would resolve to /live-projects/letters/css/… and break. Redirect to the slash
#    version, keeping any ?query (e.g. ?abrir).
location = /live-projects/letters/invitacion-boda-isaias-y-nicole {
    return 301 $uri/$is_args$args;
}

# 2) The site itself. `root` + a folder tree that mirrors the URL keeps this simple
#    (nginx appends the URL path to root; no `alias` pitfalls).
location ^~ /live-projects/letters/invitacion-boda-isaias-y-nicole/ {
    root /var/www/my-brand;
    index index.html;
    try_files $uri $uri/ =404;

    # Compress the text files (fonts.css carries the embedded script font: ~64 KB).
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Build inputs and dotfiles are never meant to be public, even if uploaded by mistake.
    # (First on purpose: nginx uses the first regex location that matches.)
    location ~ /(?:\.|tools/|design/|deploy/) {
        deny all;
    }

    # HTML/CSS/JS keep their names between updates: always revalidate
    # (a cheap 304 when unchanged) so guests never see an old version.
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache" always;
    }
    # Images and the song: cache for a day, then revalidate.
    location ~* \.(?:webp|jpg|png|mp3)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }
}
